 for(const k in UPG){const U=UPG[k],l=upl(k),max=U.cost.length;addBtn(U.e+' '+U.n+' · Nivel '+l+'/'+max,l>=max?'alt':'blu',()=>{if(l>=max)return;const c=U.cost[l];if(META.fama<c){flashMsg('Te falta fama');return;}META.fama-=c;META.upg[k]=l+1;saveMeta();sfx.win();meta_gym();},l>=max?'Máximo':'Cuesta '+U.cost[l]+'⭐');}
 addBtn('Volver','alt',menu);}
function maskEditor(){const m=META.mask;let h='<h1>🎨 Tu máscara</h1><canvas id="mprev" width="32" height="40" style="width:128px;height:160px;image-rendering:pixelated;display:block;margin:0 auto 8px;background:#2f1c50;border:3px solid #000"></canvas><h2>Color principal</h2>'+COLORS.map(c=>'<span class="sw '+(m.a===c?'sel':'')+'" data-a="a" data-c="'+c+'" style="background:'+c+'"></span>').join('')+'<h2>Color secundario</h2>'+COLORS.map(c=>'<span class="sw '+(m.b===c?'sel':'')+'" data-a="b" data-c="'+c+'" style="background:'+c+'"></span>').join('')+'<h2>Diseño</h2>';
 for(const p in PATTERNS){const own=META.pats.includes(p),cost=PATTERNS[p];h+='<div class="opt '+(m.p===p?'sel ':'')+(own?'':'lock')+'" data-p="'+p+'"><div><b>'+PATN[p]+'</b>'+(own?'':typeof cost==='number'?' · 🔒 '+cost+'⭐':' · 🎟️ del pase de temporada')+'</div></div>';}
 h+='<p class="small">En la versión de tienda, los diseños también se podrían comprar con dinero real.</p>';showPanel(h);
 const pc=$('#mprev').getContext('2d');pc.imageSmoothingEnabled=false;luchador(pc,8,6,[m.a,m.b,m.p],false,'#d9a066',m.b,false);
 document.querySelectorAll('#pn .sw').forEach(el=>el.onclick=()=>{m[el.dataset.a]=el.dataset.c;saveMeta();maskEditor();});
 document.querySelectorAll('#pn .opt').forEach(el=>el.onclick=()=>{const p=el.dataset.p;if(!META.pats.includes(p)){const c=PATTERNS[p];if(typeof c!=='number'){flashMsg('Se gana en el pase');return;}if(META.fama<c){flashMsg('Te falta fama');return;}META.fama-=c;META.pats.push(p);sfx.win();}m.p=p;saveMeta();maskEditor();});
 addBtn('Listo','',menu);}
function passView(){const lvl=Math.min(PASS.length,Math.floor(META.pass.xp/PASSXP));let h='<h1>🎟️ Pase de temporada</h1><p>'+SEASON.n+'\nXP: '+META.pass.xp+' · Nivel '+lvl+'/'+PASS.length+' (cada '+PASSXP+' de fama ganada = 1 nivel)</p><div class="passrow"><b>Nv</b><b>Gratis</b><b>💎 Premium</b></div>';
 PASS.forEach((r,i)=>{const got=META.pass.claimed.includes(i),av=i<lvl;const f=r.f;const ft=f[0]==='fama'?'⭐ '+f[1]+' fama':f[0]==='pat'?'🎨 Diseño '+PATN[f[1]]:'🏅 Título: '+f[1];
  h+='<div class="passrow"><div>'+(i+1)+'</div><div class="'+(got?'got':'')+'" data-i="'+i+'">'+ft+(got?' ✔':av?' 👉 COBRAR':' 🔒')+'</div><div class="prem">🔒 '+r.p+'</div></div>';});
 h+='<p class="small">El carril premium sería de pago en la versión de tienda (solo cosméticos, sin ventajas).</p>';showPanel(h);
 document.querySelectorAll('.passrow div[data-i]').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(i>=lvl||META.pass.claimed.includes(i))return;const f=PASS[i].f;if(f[0]==='fama'){META.fama+=f[1];}if(f[0]==='pat'&&!META.pats.includes(f[1]))META.pats.push(f[1]);if(f[0]==='titulo')META.titulo=f[1];META.pass.claimed.push(i);saveMeta();sfx.win();passView();});
 addBtn('Volver','alt',menu);}
function album(){let h='<h1>📖 Álbum</h1><h2>Máscaras ganadas ('+META.album.length+'/'+Object.keys(MASKS).length+')</h2><div class="grid">';
 for(const k in MASKS){const own=META.album.includes(k);h+='<div class="alb '+(own?'':'no')+'"><div class="ic">'+(own?MASKS[k].e:'❔')+'</div>'+(own?MASKS[k].n.replace('Máscara ',''):(MASKS[k].season?'De temporada':'???'))+'</div>';}
 h+='</div><h2>Rivales desenmascarados</h2><div class="grid">';for(const k of['emperador','siniestro','inmortal','catrina','nieve']){const own=META.unmasked.includes(k);h+='<div class="alb '+(own?'':'no')+'"><div class="ic">'+(own?'😶':'🎭')+'</div>'+(own?EN[k].n:'???')+'</div>';}
 h+='</div><h2>Estadísticas</h2><p>Temporadas jugadas: '+META.stats.runs+'\nCampeonatos: '+META.stats.wins+'\nMejor llegada: '+(META.stats.bestAct>=4?'¡Campeón!':'Acto '+META.stats.bestAct)+'\nFama total ganada: '+META.total+'</p>';showPanel(h);addBtn('Volver','alt',menu);}

// ---------- Compartir ----------
function share(victory){const c=document.createElement('canvas');c.width=360;c.height=480;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
 const g=x.createLinearGradient(0,0,0,480);g.addColorStop(0,'#3a1466');g.addColorStop(1,'#120a1e');x.fillStyle=g;x.fillRect(0,0,360,480);
 x.fillStyle='#ff2e88';x.fillRect(0,0,360,8);x.fillRect(0,472,360,8);
 x.fillStyle='#ffd23f';x.font='bold 22px monospace';x.textAlign='center';x.fillText('MÁSCARA CONTRA MÁSCARA',180,42);
 x.save();x.scale(8,8);luchador(x,14.5,7,[META.mask.a,META.mask.b,META.mask.p],false,'#d9a066',META.mask.b,victory);x.restore();
 x.fillStyle='#fff';x.font='bold 20px monospace';x.fillText(victory?'🏆 ¡CAMPEÓN MUNDIAL!':'Llegué a: '+ACTS[Math.min(P.act,2)].n,180,345);
 x.font='16px monospace';x.fillText(LUCH[P.l].n+(P.hard?' · Cabellera':''),180,375);x.fillText('Luchas ganadas: '+P.won+'  ·  Fama: '+P.fama,180,402);
 x.fillText('Máscaras: '+(P.masks.map(m=>MASKS[m].e).join(' ')||'—'),180,429);x.fillStyle='#ff9ccf';x.font='bold 14px monospace';x.fillText('¿Me superas?',180,458);
 const url=c.toDataURL('image/png');const txt='🎭 '+(victory?'¡Fui CAMPEÓN MUNDIAL':'Llegué a '+ACTS[Math.min(P.act,2)].n)+' en Máscara contra Máscara con '+LUCH[P.l].n+'. '+P.won+' luchas ganadas. ¿Me superas?';
 showPanel('<h1>📸 Tu resultado</h1><img src="'+url+'" style="width:100%;border:3px solid #000"><p class="small">Mantén presionada la imagen para guardarla y compartirla.</p>');
 addBtn('📋 Copiar texto para compartir','blu',async()=>{try{await navigator.clipboard.writeText(txt);flashMsg('¡Copiado!');}catch(e){flashMsg('No se pudo copiar');}});addBtn('Volver al menú','',menu);}

// ---------- Efectos ----------
let shoutT=0;function shout(t){const s=$('#shout');s.textContent=t;s.classList.add('on');clearTimeout(shoutT);shoutT=setTimeout(()=>s.classList.remove('on'),900);}
function shake(){const w=$('#ringwrap');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');}
const PARTS=[];function confetti(n){for(let i=0;i<n;i++)PARTS.push({x:R(20,180),y:R(-10,10),vx:R(-.6,.6),vy:R(.4,1.4),c:pick(['#ff2e88','#ffd23f','#3b6fb6','#2ecc71','#fff']),l:R(60,110)});}
function count123(cb){let i=0;const n=['1...','2...','¡¡3!!'];const step=()=>{if(i<3){shout(n[i]);sfx.slap();if(i===2){sfx.bell();confetti(20);}i++;setTimeout(step,480);}else setTimeout(cb,350);};step();}
function ad(cb){const o=$('#adov');o.classList.add('on');let n=3;$('#adc').textContent=n;const t=setInterval(()=>{n--;$('#adc').textContent=n;if(n<=0){clearInterval(t);o.classList.remove('on');cb();}},1000);}

// ---------- UI ----------
function showPanel(h){$('#pn').innerHTML=h;$('#ov').classList.add('on');$('#pn').scrollTop=0;}
function hidePanel(){$('#ov').classList.remove('on');}
function addBtn(l,c,f,sub){const b=document.createElement('button');b.className='b '+(c||'');b.innerHTML=l+(sub?'<div class="small">'+sub+'</div>':'');b.onclick=()=>{sfx.card();f();};$('#pn').appendChild(b);}
function setLog(t){$('#log').innerHTML=t;}
function float(who,t,col){const w=$('#ringwrap');const e=document.createElement('div');e.className='fl';e.textContent=t;e.style.color=col;e.style.left=(who==='p'?16+R(0,12):60+R(0,12))+'%';e.style.top='46%';w.appendChild(e);setTimeout(()=>e.remove(),900);}
function stHTML(st,block){let h='';if(block)h+='<b>🛡'+block+'</b>';for(const k in st)if(st[k])h+='<b>'+STI[k]+(k==='mareado'?'':st[k])+'</b>';return h;}
function render(){
 const inC=!!C;
 if(!P){$('#tAct').textContent='🎭 MCM';$('#tHp').textContent='';$('#tGold').textContent=META?'⭐'+META.fama:'';$('#relics').textContent='';}
 else{$('#tAct').textContent=P.daily?'📅 Del día':'Acto '+(P.act+1)+' · '+(P.step+1)+'/6';$('#tHp').textContent='❤ '+Math.max(0,P.hp)+'/'+P.max;$('#tGold').textContent='$'+P.gold;$('#relics').textContent=P.masks.map(m=>MASKS[m].e).join('');}
 $('#endT').disabled=!inC||C.busy;$('#relevo').disabled=!inC||C.busy||C.relevoUsed;if(!inC)$('#relevo').style.display='none';
 if(P){$('#pName').textContent=LUCH[P.l].e+' '+LUCH[P.l].n;$('#pHpI').style.width=Math.max(0,P.hp/P.max*100)+'%';$('#pHpT').textContent=Math.max(0,P.hp)+'/'+P.max;}
 if(!inC){$('#hand').innerHTML='';$('#eName').textContent='';$('#eHpI').style.width='0';$('#eHpT').textContent='';$('#intent').style.display='none';$('#pSt').innerHTML='';$('#eSt').innerHTML='';$('#en').textContent='';$('#piles').textContent='';$('#affI').style.width='0';$('#affT').textContent='Afición';$('#sus').textContent='';if(!P){$('#pName').textContent='';$('#pHpI').style.width='0';$('#pHpT').textContent='';}return;}
 const E=C.e;$('#eName').textContent=E.n;$('#eHpI').style.width=Math.max(0,E.hp/E.max*100)+'%';$('#eHpT').textContent=Math.max(0,E.hp)+'/'+E.max;
 $('#intent').style.display=C.over?'none':'block';$('#intent').textContent=intentText();
 $('#pSt').innerHTML=stHTML(C.p.st,C.p.block);$('#eSt').innerHTML=stHTML(E.st,E.block);
 $('#affI').style.width=C.aff*10+'%';$('#affT').textContent='Afición '+C.aff+'/10';
 $('#sus').textContent=P.l==='R'||C.sus?'👁 Réferi '+'▮'.repeat(Math.min(5,C.sus))+'▯'.repeat(Math.max(0,5-C.sus)):'';
 $('#en').textContent='⚡'+C.energy+'/'+C.maxE;$('#piles').textContent='Mazo '+C.pile.length+' · Desc. '+C.disc.length;
 $('#hand').innerHTML=C.hand.map((c,i)=>cardHTML(c,i,def(c).c>C.energy||C.busy)).join('');
 document.querySelectorAll('#hand .card').forEach(el=>el.onclick=()=>play(+el.dataset.i));}

// ---------- Ring ----------
const cv=$('#ring'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
function luchador(ctx,x,y,m,flip,skin,trunk,fr){const P_=(a,b,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(flip?x+(16-a-w):x+a,y+b,w,h);};const[A,B,pat]=m;
 P_(4,24,3,6,skin);P_(9,24,3,6,skin);P_(3,29,4,3,B);P_(9,29,4,3,B);P_(3,20,10,5,trunk);
 P_(3,10,10,10,skin);P_(5,13,2,1,'rgba(0,0,0,.2)');P_(9,13,2,1,'rgba(0,0,0,.2)');
 const lift=fr?-3:0;P_(0,10+lift,3,8,skin);P_(13,10,3,8,skin);P_(0,17+lift,3,2,A);P_(13,17,3,2,A);
 P_(4,1,8,9,A);P_(5,0,6,1,A);
 if(pat==='bolt'){P_(7,1,2,2,B);P_(6,3,2,2,B);P_(7,5,2,1,B);}if(pat==='star'){P_(7,1,2,3,B);P_(6,2,4,1,B);}
 if(pat==='crown'){P_(4,0,1,2,B);P_(7,-1,2,2,B);P_(11,0,1,2,B);}if(pat==='horns'){P_(3,-1,1,3,B);P_(12,-1,1,3,B);}
 if(pat==='crest'){P_(6,-2,4,2,B);P_(7,-3,2,1,B);}if(pat==='bands'){P_(4,3,8,1,B);P_(4,7,8,1,B);}
 if(pat==='skull'){P_(5,7,6,1,B);P_(6,8,1,1,B);P_(9,8,1,1,B);}if(pat==='spots'){P_(5,2,1,1,B);P_(10,3,1,1,B);P_(6,8,1,1,B);}
 if(pat==='fin'){P_(7,-2,3,3,B);}if(pat==='x'){P_(5,2,1,1,B);P_(10,2,1,1,B);P_(7,4,2,1,B);}
 if(pat==='flame'){P_(5,6,1,3,B);P_(10,6,1,3,B);P_(6,8,4,1,B);P_(7,-1,2,1,B);}
 if(pat==='heart'){P_(6,1,1,1,B);P_(9,1,1,1,B);P_(6,2,4,1,B);P_(7,3,2,1,B);}
 if(pat==='diamond'){P_(7,0,2,1,B);P_(6,1,4,1,B);P_(7,2,2,1,B);P_(4,7,1,1,B);P_(11,7,1,1,B);}
 if(pat==='hair'){P_(4,0,8,2,B);P_(4,2,1,2,B);P_(11,2,1,2,B);}
 if(pat==='hair'){P_(5,4,2,1,'#fff');P_(9,4,2,1,'#fff');P_(6,4,1,1,'#222');P_(10,4,1,1,'#222');P_(7,8,2,1,'#8a3a3a');}
 else{P_(5,4,2,2,B);P_(9,4,2,2,B);P_(6,5,1,1,'#fff');P_(10,5,1,1,'#fff');P_(7,8,2,1,'#5a2020');}}
const CROWD=[];for(let i=0;i<120;i++)CROWD.push([Math.floor(Math.random()*200),2+Math.floor(Math.random()*34),['#ff2e88','#ffd23f','#3b6fb6','#fff','#2ecc71','#e67e22'][i%6]]);
let tk=0;
function playerMask(){return P&&P.l===META.sel.l?[META.mask.a,META.mask.b,META.mask.p]:P?LUCH[P.l].m:[META.mask.a,META.mask.b,META.mask.p];}
function drawRing(){tk++;cx.fillStyle='#1d0f33';cx.fillRect(0,0,200,104);
 const hype=C?C.aff:2;for(const[x,y,c]of CROWD){cx.fillStyle=c;cx.globalAlpha=.55;const j=(Math.floor(tk/(hype>7?4:8)+x)%3===0&&hype>3)?(hype>7?2:1):0;cx.fillRect(x,y-j,2,2);}cx.globalAlpha=1;
 cx.fillStyle='#ffffff10';for(let i=0;i<4;i++){cx.beginPath();cx.moveTo(30+i*50,0);cx.lineTo(10+i*55,40);cx.lineTo(25+i*55,40);cx.fill();}
 cx.fillStyle=SEASON.k==='muertos'?'#e8b04a':'#d0cfe0';cx.fillRect(10,72,180,22);cx.fillStyle='#b7b5cc';cx.fillRect(10,90,180,4);cx.fillStyle='#2b2140';cx.fillRect(10,94,180,10);
 cx.fillStyle='#ccc';cx.fillRect(10,40,4,54);cx.fillRect(186,40,4,54);['#e74c3c','#fff','#3b6fb6'].forEach((c,i)=>{cx.fillStyle=c;cx.fillRect(10,48+i*7,180,1);});
 const pm=playerMask(),sk='#d9a066';
 if(C){const a=C.anim;const frozen=a.stop>0;const px=46+(a.p>0?6:0)-(a.pf>0?(a.pf%2?2:-2):0),ex=136-(a.e>0?6:0)+(a.ef>0?(a.ef%2?2:-2):0);
  if(!(a.pf>0&&a.pf%2))luchador(cx,px,40,pm,false,sk,pm[1],a.p>0);else luchador(cx,px,40,['#fff','#fff','star'],false,'#fff','#fff',false);
  if(C.over&&C.e.hp<=0){cx.save();cx.translate(ex+16,88);cx.rotate(Math.PI/2);luchador(cx,-16,-16,C.e.m,true,'#c68a55',C.e.m[1],false);cx.restore();cx.fillStyle='#111';cx.fillRect(100,52,6,16);cx.fillStyle='#fff';cx.fillRect(100,52,2,16);cx.fillRect(104,52,2,16);}
  else if(!(a.ef>0&&a.ef%2))luchador(cx,ex,40,C.e.m,true,'#c68a55',C.e.m[1],a.e>0);else luchador(cx,ex,40,['#fff','#fff','star'],true,'#fff','#fff',false);
  if(frozen)a.stop--;else for(const k of['p','e','pf','ef'])if(a[k]>0)a[k]--;}
 else if(UNM){UNM.t++;luchador(cx,46,40,pm,false,sk,pm[1],true);const off=Math.min(30,UNM.t*.6);
  luchador(cx,136,40,['#c68a55','#3a2a1a','hair'],true,'#c68a55',UNM.m[1],false);
  cx.fillStyle=UNM.m[0];cx.fillRect(140-off*.2,40-off,8,9);cx.fillStyle=UNM.m[1];cx.fillRect(141-off*.2,43-off,2,2);cx.fillRect(145-off*.2,43-off,2,2);}
 else if(P){luchador(cx,92,40,pm,false,sk,pm[1],Math.floor(tk/30)%2);}
 else if(META){luchador(cx,92,40,[META.mask.a,META.mask.b,META.mask.p],false,sk,META.mask.b,Math.floor(tk/30)%2);}
 for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.x+=p.vx;p.y+=p.vy;p.l--;cx.fillStyle=p.c;cx.fillRect(Math.round(p.x),Math.round(p.y),2,2);if(p.l<=0||p.y>104)PARTS.splice(i,1);}
 requestAnimationFrame(drawRing);}
$('#endT').onclick=endTurn;$('#relevo').onclick=relevo;

// ---------- Inicio ----------
loadMeta();drawRing();
const st=checkStreak();menu();
if(st){const msg=document.createElement('p');msg.innerHTML='🔥 <b>Racha de '+META.streak.n+' día'+(META.streak.n>1?'s':'')+'</b>: +'+st+' fama por volver hoy.';msg.style.cssText='background:#2e9d46;padding:6px;border:2px solid #000';$('#pn').insertBefore(msg,$('#pn').children[1]);}
